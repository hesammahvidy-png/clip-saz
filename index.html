
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کلیپ‌ساز من</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#101321;
  color:#fff;
}
header{
  text-align:center;
  padding:24px 12px;
  background:linear-gradient(135deg,#6638d0,#1678c8);
}
header h1{margin:0 0 8px;font-size:25px}
header p{margin:0;font-size:13px}
main{max-width:650px;margin:auto;padding:16px}
.card{
  background:#1d2235;
  padding:16px;
  border-radius:16px;
  margin-bottom:15px;
}
h2{font-size:17px;margin-top:0}
label{display:block;margin:14px 0 7px}
input,textarea,button{
  width:100%;
  padding:12px;
  border-radius:9px;
  font:inherit;
}
input,textarea{
  border:1px solid #444b67;
  background:#111626;
  color:white;
}
textarea{min-height:100px;resize:vertical}
button{
  border:0;
  background:#8b5cf6;
  color:white;
  font-weight:bold;
  margin-top:12px;
  cursor:pointer;
}
button.secondary{background:#303951}
#preview{
  width:100%;
  aspect-ratio:9/16;
  max-height:500px;
  background:#080a12;
  border-radius:12px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
#preview img{
  width:100%;
  height:100%;
  object-fit:contain;
  position:absolute;
}
#caption{
  z-index:2;
  padding:16px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  text-shadow:2px 2px 5px black;
  background:#0005;
}
small,.note{color:#b9c2db;line-height:1.9}
audio{width:100%;margin-top:12px}
.status{color:#8ff0bb;font-size:13px;line-height:1.8}
</style>
</head>
<body>

<header>
  <h1>🎬 کلیپ‌ساز من</h1>
  <p>متن، عکس و موسیقی را برای کلیپ خودت آماده کن</p>
</header>

<main>
  <section class="card">
    <h2>۱. ایدهٔ کلیپ</h2>
    <label for="idea">متن یا داستان کلیپ</label>
    <textarea id="idea" placeholder="مثلاً: یک کودک در جنگل جادویی دنبال یک اژدهای مهربان می‌گردد..."></textarea>

    <label for="photo">۲. انتخاب عکس</label>
    <input id="photo" type="file" accept="image/*">

    <label for="music">۳. انتخاب آهنگ</label>
    <input id="music" type="file" accept="audio/*">

    <button id="make">ساخت پیش‌نمایش</button>
    <p class="note">این نسخه فایل‌های انتخابی را در همین صفحه نمایش می‌دهد؛ هنوز متن را به انیمیشن واقعی تبدیل نمی‌کند.</p>
  </section>

  <section class="card">
    <h2>پیش‌نمایش کلیپ</h2>
    <div id="preview">
      <div id="caption">داستانت را اینجا بنویس 🎥</div>
    </div>
    <p id="status" class="status">آمادهٔ شروع</p>
    <audio id="player" controls hidden></audio>
    <button id="save" class="secondary">ذخیرهٔ ویدئو</button>
    <p class="note">ذخیرهٔ ویدئو فقط وقتی فعال می‌شود که ضبط پیش‌نمایش انجام شده باشد.</p>
  </section>
</main>

<script>
const idea = document.getElementById('idea');
const photo = document.getElementById('photo');
const music = document.getElementById('music');
const caption = document.getElementById('caption');
const preview = document.getElementById('preview');
const status = document.getElementById('status');
const player = document.getElementById('player');

let imageURL = '';
let musicURL = '';
let recorder = null;
let chunks = [];
let videoURL = '';

document.getElementById('make').addEventListener('click', () => {
  caption.textContent = idea.value.trim() || 'داستانت را اینجا بنویس 🎥';

  if (imageURL) {
    const old = preview.querySelector('img');
    if (old) old.remove();

    const img = document.createElement('img');
    img.src = imageURL;
    img.alt = 'تصویر کلیپ';
    preview.prepend(img);
  }

  if (musicURL) {
    player.src = musicURL;
    player.hidden = false;
  }

  status.textContent = 'پیش‌نمایش آماده است. برای ساخت انیمیشن واقعی، موتور ویدئوساز لازم است.';
});

photo.addEventListener('change', () => {
  if (!photo.files || !photo.files[0]) return;
  if (imageURL) URL.revokeObjectURL(imageURL);
  imageURL = URL.createObjectURL(photo.files[0]);
});

music.addEventListener('change', () => {
  if (!music.files || !music.files[0]) return;
  if (musicURL) URL.revokeObjectURL(musicURL);
  musicURL = URL.createObjectURL(music.files[0]);
  player.src = musicURL;
  player.hidden = false;
});

document.getElementById('save').addEventListener('click', () => {
  if (!window.MediaRecorder || !preview.captureStream) {
    status.textContent = 'مرورگر این قابلیت ضبط را پشتیبانی نمی‌کند.';
    return;
  }

  if (recorder && recorder.state === 'recording') {
    recorder.stop();
    return;
  }

  const canvas = document.createElement('canvas');
  canvas.width = 720;
  canvas.height = 1280;
  const ctx = canvas.getContext('2d');

  const draw = () => {
    ctx.fillStyle = '#15172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (imageURL) {
      const img = preview.querySelector('img');
      if (img && img.complete) {
        const scale = Math.min(
          canvas.width / img.naturalWidth,
          canvas.height / img.naturalHeight
        );
        const w = img.naturalWidth * scale;
        const h = img.naturalHeight * scale;
        ctx.drawImage(img, (canvas.width-w)/2, (canvas.height-h)/2, w, h);
      }
    }

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 38px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const words = (idea.value || 'کلیپ من').split(/\s+/);
    let lines = [], line = '';
    for (const word of words) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > 620 && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);

    const lineHeight = 52;
    const startY = canvas.height / 2 -
      (lines.length - 1) * lineHeight / 2;

    lines.forEach((text, i) => {
      ctx.fillText(text, 360, startY + i * lineHeight, 640);
    });
  };

  draw();
  const stream = canvas.captureStream(24);
  chunks = [];

  try {
    recorder = new MediaRecorder(stream, {
      mimeType: 'video/webm'
    });
  } catch (e) {
    recorder = new MediaRecorder(stream);
  }

  recorder.ondataavailable = e => {
    if (e.data && e.data.size) chunks.push(e.data);
  };

  recorder.onstop = () => {
    const blob = new Blob(chunks, {
      type: recorder.mimeType || 'video/webm'
    });
    if (videoURL) URL.revokeObjectURL(videoURL);
    videoURL = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = videoURL;
    a.download = 'my-clip.webm';
    a.click();

    stream.getTracks().forEach(track => track.stop());
    status.textContent = 'فایل ویدئو دانلود شد.';
    document.getElementById('save').textContent = 'ذخیرهٔ ویدئو';
  };

  recorder.start();
  status.textContent = 'در حال ضبط پیش‌نمایش؛ دوباره دکمه را بزن تا ذخیره شود.';
  document.getElementById('save').textContent = 'پایان ضبط و دانلود';
});
</script>
</body>
</html>
